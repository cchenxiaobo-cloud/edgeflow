# EdgeFlow CI 流水线
# 每次 push / PR 时执行：lint（强制）+ go vet + build + test（含覆盖率门槛 ≥70%）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint（golangci-lint）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      # lint 失败即失败（强制）。action 预编译二进制（go1.24）低于仓库工具链
      # （go 1.26.2）会拒载配置——改源码安装与 setup-go 工具链一致；
      # linter 集合见 .golangci.yml（分阶段启用，已登记技术债）。
      - name: 安装 golangci-lint（源码编译，与仓库 Go 工具链一致）
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: 运行 golangci-lint
        run: "$(go env GOPATH)/bin/golangci-lint run ./..."

  build-test:
    name: Build & Test（覆盖率门槛 ≥70%）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.x"]
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true # setup-go 自带 Go 模块缓存

      - name: 静态检查（go vet）
        run: go vet ./...

      - name: 编译（go build）
        run: go build ./...

      # e2e 套件（约 13 分钟）不进 race 步骤：默认 10m 超时必撞——由下方
      # 独立步骤按项目门禁口径（-timeout 30m，无 race）运行。
      # mappers/video 排除：TestV0420MapperRTSPE2E 断流重连检测在 2 核 runner
      # 低 fps 环境连续两轮超时未达成（本地 race 稳定通过，属测试环境时序
      # 依赖非代码缺陷，KI §69 登记）——本地门禁保留该包。
      - name: 单元测试（go test -race，不含 e2e/mappers-video）
        run: go test -race -timeout 20m $(go list ./... | grep -vE '/tests/e2e$|/mappers/video$')

      # 覆盖率门槛：仅单元包（首轮实测 71.7%）；总覆盖率 <70% 则 CI 失败
      - name: 覆盖率检查（总覆盖率 ≥70%）
        run: |
          go test $(go list ./... | grep -v '/tests/e2e') -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          echo "总覆盖率: ${total}%"
          if awk -v t="$total" 'BEGIN { exit !(t >= 70) }'; then
            echo "✅ 总覆盖率 ${total}% ≥ 70%，门槛通过"
          else
            echo "❌ 总覆盖率 ${total}% < 70%，未达门槛，CI 失败"
            exit 1
          fi

      # 场景 e2e：项目版本门禁口径（全套约 13 分钟；-timeout 30m；无 race）
      - name: 场景 e2e（-timeout 30m）
        run: go test ./tests/e2e/ -count=1 -timeout 30m
