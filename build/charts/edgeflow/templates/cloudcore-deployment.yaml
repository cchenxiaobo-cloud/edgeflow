apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgeflow.fullname" . }}-cloudcore
  labels:
    {{- include "edgeflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudcore
spec:
  replicas: {{ .Values.cloudcore.replicaCount }}
  selector:
    matchLabels:
      {{- include "edgeflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cloudcore
  template:
    metadata:
      labels:
        {{- include "edgeflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cloudcore
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: data
          {{- if and .Values.cloudcore.etcd.persistence.enabled .Values.cloudcore.etcd.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "edgeflow.fullname" . }}-cloudcore-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      terminationGracePeriodSeconds: {{ .Values.cloudcore.terminationGracePeriodSeconds }}
      {{- with .Values.cloudcore.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cloudcore.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cloudcore.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cloudcore
          image: "{{ .Values.cloudcore.image.repository }}:{{ .Values.cloudcore.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.cloudcore.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.cloudcore.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.cloudcore.port.http }}
              protocol: TCP
            - name: hub
              containerPort: {{ .Values.cloudcore.port.hub }}
              protocol: TCP
          # mTLS 证书目录：只读根文件系统下挂载可写 /data（M4B P1-3），
          # 证书自动生成落在 /data/certs/（配合 EDGEFLOW_CLOUDCORE_CERT_DIR）。
          volumeMounts:
            - name: data
              mountPath: /data
          {{- if or (len .Values.cloudcore.env) (len .Values.cloudcore.extraEnv) }}
          env:
            {{- range $key, $value := .Values.cloudcore.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.cloudcore.etcd.enabled }}
            {{- range $key, $value := .Values.cloudcore.etcd.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- else }}
            # etcd 显式关闭：覆盖任何可能残留的 ETCD_ENABLED=true（防环境变量透传误开）
            - name: EDGEFLOW_CLOUDCORE_ETCD_ENABLED
              value: "false"
            {{- end }}
            {{- with .Values.cloudcore.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.cloudcore.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.cloudcore.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.cloudcore.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.cloudcore.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.cloudcore.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.cloudcore.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.cloudcore.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.cloudcore.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.cloudcore.resources | nindent 12 }}
