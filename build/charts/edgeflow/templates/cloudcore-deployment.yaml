apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgeflow.fullname" . }}-cloudcore
  labels:
    {{- include "edgeflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudcore
{{- /* ============ 渲染守卫（v0.6.0 收窄：仅 embed 模式禁止多副本；外部模式 v0.6.0 起支持多副本真多活） ============ */}}
{{- if and .Values.cloudcore.etcd.enabled .Values.cloudcore.etcd.external.enabled (not .Values.cloudcore.etcd.external.endpoints) }}
  {{- fail "cloudcore.etcd.external.enabled=true 时 endpoints 不能为空（至少一个 http(s) 端点）" }}
{{- end }}
{{- if and .Values.cloudcore.etcd.enabled (not .Values.cloudcore.etcd.external.enabled) (gt (int .Values.cloudcore.replicaCount) 1) }}
  {{- fail "cloudcore.replicaCount>1 在 embed 模式（cloudcore.etcd.external.enabled=false）下 = 多副本各自 embed + 共享 PVC 脑裂（键空间互相覆盖），显式禁止。请保持 replicaCount=1（外部 etcd 模式（external.enabled=true）支持多副本，见 values 注释）" }}
{{- end }}
spec:
  replicas: {{ .Values.cloudcore.replicaCount }}
  selector:
    matchLabels:
      {{- include "edgeflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cloudcore
  template:
    metadata:
      labels:
        {{- include "edgeflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cloudcore
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: data
          {{- if and .Values.cloudcore.etcd.persistence.enabled .Values.cloudcore.etcd.enabled (not .Values.cloudcore.etcd.external.enabled) }}
          persistentVolumeClaim:
            claimName: {{ include "edgeflow.fullname" . }}-cloudcore-data
          {{- else }}
          # 外部 etcd 模式不落本地盘（数据在共享集群），/data 仅备用（如 mTLS 证书目录）→ emptyDir
          emptyDir: {}
          {{- end }}
      terminationGracePeriodSeconds: {{ .Values.cloudcore.terminationGracePeriodSeconds }}
      {{- with .Values.cloudcore.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cloudcore.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cloudcore.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cloudcore
          image: "{{ .Values.cloudcore.image.repository }}:{{ .Values.cloudcore.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.cloudcore.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.cloudcore.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.cloudcore.port.http }}
              protocol: TCP
            - name: hub
              containerPort: {{ .Values.cloudcore.port.hub }}
              protocol: TCP
          # mTLS 证书目录：只读根文件系统下挂载可写 /data（M4B P1-3），
          # 证书自动生成落在 /data/certs/（配合 EDGEFLOW_CLOUDCORE_CERT_DIR）。
          volumeMounts:
            - name: data
              mountPath: /data
          {{- if or (len .Values.cloudcore.env) (len .Values.cloudcore.extraEnv) }}
          env:
            {{- range $key, $value := .Values.cloudcore.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.cloudcore.etcd.enabled }}
              {{- if .Values.cloudcore.etcd.external.enabled }}
            # 外部 etcd 模式（v0.6.0 起支持多副本真多活）：共享集群直连；embed 字段（DATA_DIR/CLIENT_URL/PEER_URL/
            # QUOTA/COMPACTION/STRICT）不注入——应用侧对显式设置的 embed 字段会 Warn「仅 embed 生效」
            - name: EDGEFLOW_CLOUDCORE_ETCD_ENABLED
              value: "true"
            - name: EDGEFLOW_CLOUDCORE_ETCD_ENDPOINTS
              value: {{ join "," .Values.cloudcore.etcd.external.endpoints | quote }}
              {{- if .Values.cloudcore.etcd.external.tls.ca }}
            - name: EDGEFLOW_CLOUDCORE_ETCD_TLS_CA
              value: {{ .Values.cloudcore.etcd.external.tls.ca | quote }}
              {{- end }}
              {{- if .Values.cloudcore.etcd.external.tls.cert }}
            - name: EDGEFLOW_CLOUDCORE_ETCD_TLS_CERT
              value: {{ .Values.cloudcore.etcd.external.tls.cert | quote }}
              {{- end }}
              {{- if .Values.cloudcore.etcd.external.tls.key }}
            - name: EDGEFLOW_CLOUDCORE_ETCD_TLS_KEY
              value: {{ .Values.cloudcore.etcd.external.tls.key | quote }}
              {{- end }}
              {{- if .Values.cloudcore.etcd.external.allowInsecure }}
            # 逃生门（显式 opt-in）：允许「非回环端点 + 无 TLS」启动；应用启动期打大告警
            - name: EDGEFLOW_CLOUDCORE_ETCD_ALLOW_INSECURE
              value: "1"
              {{- end }}
              {{- if and .Values.cloudcore.etcd.external.auth.username .Values.cloudcore.etcd.external.auth.password }}
            # RBAC 用户名密码鉴权（v0.8.0，L1）：与 TLS/mTLS 正交；只设其一 → 应用启动 fail-fast
            - name: EDGEFLOW_CLOUDCORE_ETCD_USERNAME
              value: {{ .Values.cloudcore.etcd.external.auth.username | quote }}
            - name: EDGEFLOW_CLOUDCORE_ETCD_PASSWORD
              value: {{ .Values.cloudcore.etcd.external.auth.password | quote }}
              {{- end }}
              {{- if gt (int .Values.cloudcore.replicaCount) 1 }}
            # 多副本真多活（v0.6.0）：注入多副本标识——/healthz 绑定 etcd 连接状态（失联 >TTL
            # → 503 → liveness 重启自愈）；单副本（replicaCount=1）保持 v0.5.0 healthz 进程存活语义
            - name: EDGEFLOW_CLOUDCORE_MULTI_REPLICA
              value: "1"
              {{- end }}
              {{- if .Values.cloudcore.etcd.external.nodeLeaseTTL }}
            # 心跳租约 TTL（v0.6.0，仅外部模式消费）：判活阈值（默认 300s）；空 = 应用默认，不注入
            - name: EDGEFLOW_CLOUDCORE_NODE_LEASE_TTL
              value: {{ .Values.cloudcore.etcd.external.nodeLeaseTTL | quote }}
              {{- end }}
              {{- else }}
              {{- range $key, $value := .Values.cloudcore.etcd.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
              {{- end }}
              {{- end }}
            {{- else }}
            # etcd 显式关闭：覆盖任何可能残留的 ETCD_ENABLED=true（防环境变量透传误开）；
            # 此时忽略 external.enabled（总开关优先，M1 一刀切）
            - name: EDGEFLOW_CLOUDCORE_ETCD_ENABLED
              value: "false"
            {{- end }}
            {{- with .Values.cloudcore.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.cloudcore.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.cloudcore.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.cloudcore.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.cloudcore.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.cloudcore.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.cloudcore.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.cloudcore.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.cloudcore.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.cloudcore.resources | nindent 12 }}
