apiVersion: v1
kind: Service
metadata:
  name: {{ include "edgeflow.fullname" . }}-cloudcore
  labels:
    {{- include "edgeflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudcore
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "edgeflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cloudcore
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    {{- if .Values.service.hubEnabled }}
    - name: hub
      port: {{ .Values.service.hubPort }}
      targetPort: hub
      protocol: TCP
    {{- end }}
