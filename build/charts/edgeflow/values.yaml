# ============================================================================
# EdgeFlow Chart 默认配置（WBS 8.5）
# 覆盖方式：helm install -f custom.yaml，或 --set key=value
# ============================================================================

## 全局配置（可被各组件引用）
global:
  # 部署环境标签：production / staging / dev（当前仅作标注，后续可驱动资源档位）
  environment: production

## 镜像拉取凭据（私有仓库时需要，默认空）
imagePullSecrets: []

## 资源命名覆盖
nameOverride: ""
fullnameOverride: ""

## Pod 级安全上下文：与 distroless nonroot 运行镜像匹配（uid 65532）
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  # 挂载卷时统一属主（cloudcore 默认无卷，预留）
  fsGroup: 65532

## CloudCore（云端组件）配置
cloudcore:
  # 副本数：默认 1。
  # ① embed 模式（cloudcore.etcd.external.enabled=false，默认）：**必须 = 1**——内嵌单成员 etcd，
  #   多副本各自 embed + 共享 PVC = 脑裂（各自独立的数据分叉），模板 {{ fail }} 渲染守卫兜底。
  # ② 外部模式（cloudcore.etcd.external.enabled=true）：**v0.6.0 起支持 >1（真多活）**——
  #   判活 = etcd 租约视角（心跳键存在性）+ 删除守卫，多副本安全；
  #   replicaCount>1 时模板自动注入 EDGEFLOW_CLOUDCORE_MULTI_REPLICA=1（/healthz 绑定 etcd 连接）。
  #   要求（不满足即数据风险，见 docs/DEPLOYMENT.md §10.8）：
  #   ① 全部副本同版本，禁止新旧混跑（v0.5.0 与 v0.6.0 副本同连一集群 = 旧版 GC 误删活节点）；
  #   ② etcd 集群 3 节点 quorum 健康（判活依赖 etcd 可用性：故障 >TTL 全量软离线，数分钟自愈，零数据删除）；
  #   ③ cloudcore 无状态（fleet 共享同一 endpoints，副本间无协调/无选主）。
  replicaCount: 1

  # 优雅退出宽限期：cloudcore 收到 SIGTERM 后需时间排空存量连接
  terminationGracePeriodSeconds: 30

  # 镜像配置
  image:
    # 镜像仓库：构建命令见 docs/DEPLOYMENT.md；推送到私有仓库后改为完整地址
    repository: edgeflow/cloudcore
    # 镜像标签：默认跟随 Chart appVersion（.Chart.AppVersion）
    tag: "v0.4.0"
    # 拉取策略：IfNotPresent 生产推荐；本地频繁构建调试可改 Always
    pullPolicy: IfNotPresent

  # 监听端口（与 Dockerfile EXPOSE / cloudcore 默认值对齐）
  port:
    # HTTP API + /healthz 健康检查
    http: 8080
    # CloudHub（云边 WebSocket 通道）
    hub: 10000

  # 健康检查：cloudcore 暴露 /healthz 接口
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # 资源配额：v0.4.0 上调（cloudcore 内嵌 etcd，实测 RSS 31-34MB；原 128Mi request 接近上限）
  # 实测依据与观测方法见 docs/RELEASE-NOTES-v040.md §四
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # 环境变量透传（key: value 形式）：
  #   EDGEFLOW_CLOUDCORE_PORT / EDGEFLOW_CLOUDCORE_HUB_PORT 是 cloudcore 的最高优先级配置来源，
  #   mTLS 启用：EDGEFLOW_CLOUDCORE_TLS=on + EDGEFLOW_CLOUDCORE_CERT_DIR=/data/certs
  #   （/data 挂载自持久卷 PVC（v0.4.0 起）；生产建议 Secret 预置证书，见 docs/DEPLOYMENT.md）
  env:
    EDGEFLOW_CLOUDCORE_PORT: "8080"
    EDGEFLOW_CLOUDCORE_HUB_PORT: "10000"

  # 嵌入式 etcd（v0.4.0：云端状态持久化，写穿 write-through）：
  # 注册元数据 + 设备 Desired 跨重启保留；Pod 状态/上报属性不落盘（重启短暂清空自愈）。
  # 全量环境变量与键空间见 docs/DEPLOYMENT.md §10 / docs/RELEASE-NOTES-v050.md
  #
  # v0.5.0 新增外部 etcd 模式（方案④）：external.enabled=true 时直连共享 etcd 集群
  # （EDGEFLOW_CLOUDCORE_ETCD_ENDPOINTS），跳过内嵌 embed（不建目录/不占端口）。
  # v0.6.0 起外部模式支持多副本真多活（replicaCount>1，自动注入 MULTI_REPLICA=1），
  # embed 模式仍必须 = 1（脑裂）。
  # 两种模式互斥：external.enabled=true 时本段 embed 环境变量（env 映射）不注入；
  # etcd.enabled=false 时强制注入 EDGEFLOW_CLOUDCORE_ETCD_ENABLED=false，并忽略 external.*。
  etcd:
    # 总开关：true=etcd 持久化模式（默认）；false=纯内存（v0.3.x 行为，Pod 重建即丢）
    enabled: true
    # 数据目录（容器内路径；工作目录=/，挂载自 persistence PVC）
    dataDir: /data/etcd
    # v0.5.0 外部 etcd（共享集群直连；仅 external.enabled=true 时生效）
    external:
      # true = 外部模式：注入 EDGEFLOW_CLOUDCORE_ETCD_ENDPOINTS（及 TLS/逃生门 env）、
      # 跳过本地数据卷（不创建 PVC、不注入 EDGEFLOW_CLOUDCORE_ETCD_DATA_DIR）。
      # ⚠ 外部 etcd 是显式部署依赖：连接失败/无 quorum = 拒绝启动（fail-fast），无降级路径。
      enabled: false
      # 外部 etcd 客户端端点（http/https URL 列表，逗号分隔语义）；enabled=true 且为空 → 渲染期 fail
      endpoints: []
      #   # 示例：
      #   - http://10.0.0.11:2379
      #   - http://10.0.0.12:2379
      # TLS（PEM 文件路径，注入容器后使用）：
      #   ca 非空 = 启用 TLS（服务端证书校验）；cert+key 同设 = mTLS（客户端证书）；只设其一 → 启动 fail-fast
      tls:
        ca: ""      # 例：/etc/edgeflow/etcd-tls/ca.crt（挂载 Secret/ConfigMap 后路径）
        cert: ""    # 例：/etc/edgeflow/etcd-tls/tls.crt（mTLS 客户端证书）
        key: ""     # 例：/etc/edgeflow/etcd-tls/tls.key（mTLS 客户端私钥）
      # 逃生门：true = 允许「非回环端点 + 无 TLS」启动（默认拒绝，仅限可信内网/开发）；
      # 开启后注入 EDGEFLOW_CLOUDCORE_ETCD_ALLOW_INSECURE=1（应用启动期打大告警）
      allowInsecure: false
      # 心跳租约 TTL（v0.6.0 新增，仅外部模式消费）：非空注入 EDGEFLOW_CLOUDCORE_NODE_LEASE_TTL；
      # 空 = 不注入，应用默认 300s（5m，= 10× 边缘心跳周期 30s）。
      # 调参权衡（故障免疫 vs 检测延迟）与校验（<90s Warn；≤0/非法 fail-fast）见 docs/DEPLOYMENT.md §10.8。
      # 例："300s" / "5m"（Go duration 或秒数）
      nodeLeaseTTL: ""
    # etcd 配置环境变量透传（EDGEFLOW_CLOUDCORE_ETCD_*），enabled=false 时模板强制注入
    # EDGEFLOW_CLOUDCORE_ETCD_ENABLED=false，其余不生效；external.enabled=true 时不注入（忽略）
    env:
      EDGEFLOW_CLOUDCORE_ETCD_ENABLED: "true"
      EDGEFLOW_CLOUDCORE_ETCD_DATA_DIR: "/data/etcd"
      EDGEFLOW_CLOUDCORE_ETCD_CLIENT_URL: "http://127.0.0.1:12379"
      EDGEFLOW_CLOUDCORE_ETCD_PEER_URL: "http://127.0.0.1:12380"
      EDGEFLOW_CLOUDCORE_ETCD_QUOTA_BACKEND_BYTES: "268435456"
      EDGEFLOW_CLOUDCORE_ETCD_AUTO_COMPACTION_MODE: "periodic"
      EDGEFLOW_CLOUDCORE_ETCD_AUTO_COMPACTION_RETENTION: "1h"
      # EDGEFLOW_CLOUDCORE_ETCD_STRICT: "1"   # 1=embed 启动失败即拒绝启动（fail-fast）
      # EDGEFLOW_CLOUDCORE_NODE_RETENTION: "24h"  # 节点保留期（默认 24h）
    # 数据卷（PVC）：Pod 重建/漂移不丢数据的唯一前提；enabled=false 回退 emptyDir
    persistence:
      enabled: true
      # storageClass: 留空 = 集群默认 StorageClass
      storageClass: ""
      # 容量：三类状态数据量级为 MB，1Gi 富余
      size: 1Gi
  # 扩展环境变量（标准 env 列表格式，用于 valueFrom/secretKeyRef 等复杂场景）
  extraEnv: []
  # 示例：
  # extraEnv:
  #   - name: EDGEFLOW_CLOUDCORE_TLS_CERT
  #     value: /etc/edgeflow/tls/tls.crt
  #   - name: EDGEFLOW_CLOUDCORE_TLS_KEY
  #     valueFrom:
  #       secretKeyRef:
  #         name: edgeflow-tls
  #         key: tls.key

  # 容器安全上下文（与 distroless nonroot 双重保险；cloudcore 写持久卷 /data：
  # etcd 数据 /data/etcd + mTLS 证书 /data/certs，由 PVC 提供可写）
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # 节点调度（可选）：把 cloudcore 固定到指定节点
  # nodeSelector:
  #   kubernetes.io/os: linux

  # 污点容忍（可选）
  # tolerations:
  #   - key: CriticalAddonsOnly
  #     operator: Exists

  # 亲和性（可选）
  # affinity: {}

## Service 配置
service:
  # 类型：ClusterIP 仅集群内访问；边缘节点在集群外时改 NodePort/LoadBalancer
  type: ClusterIP
  # HTTP 管理端口（集群内访问 /healthz 与查询 API）
  httpPort: 8080
  # CloudHub WebSocket 端口：云边通信入口
  hubPort: 10000
    # 是否暴露 CloudHub 端口（边缘节点跨集群接入时开启，并同步防火墙）
  hubEnabled: false
