# EdgeNode CRD（edgeflow.io/v1alpha1）
#
# 由 apis/edge/v1alpha1/edge_node.go 类型生成（手写 OpenAPI v3 schema）。
# 应用：kubectl apply -f config/crd/edgenodes.edgeflow.io.yaml
#
# 说明：当前版本中云端节点状态由 cloudcore 内存注册表 + REST API 承载
# （GET /api/v1/edgenodes），本 CRD 为真实集群接入的声明式资源定义；
# 状态字段（phase/heartbeatTime/conditions）由后续 K8s 控制器回写。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgenodes.edgeflow.io
spec:
  group: edgeflow.io
  names:
    kind: EdgeNode
    listKind: EdgeNodeList
    plural: edgenodes
    singular: edgenode
    shortNames:
      - egn
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - nodeID
              properties:
                nodeID:
                  description: 节点唯一标识（由 keadm join 生成，用于云边通信鉴权）
                  type: string
                  # v0.23.0（PRT-24）：关键 string 字段补校验标记（下同）。
                  minLength: 1
                  pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
                role:
                  description: 节点角色：edge（默认）或 cloud
                  type: string
                  enum:
                    - edge
                    - cloud
                addresses:
                  description: 节点网络地址列表（内网 IP、域名等）
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - address
                    properties:
                      type:
                        description: 地址类型，如 InternalIP / Hostname / DNS
                        type: string
                        enum:
                          - InternalIP
                          - Hostname
                          - DNS
                      address:
                        description: 地址值，如 "192.168.1.10"
                        type: string
                        minLength: 1
                        pattern: "^[a-zA-Z0-9][a-zA-Z0-9.:_-]*$"
            status:
              description: 节点运行时状态（edgecore 上报，云端只读）
              type: object
              properties:
                phase:
                  description: 生命周期阶段：Pending / Running / Offline / Unknown
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Offline
                    - Unknown
                heartbeatTime:
                  description: 最近一次心跳时间（RFC3339）
                  type: string
                  format: date-time
                lastSeenTime:
                  description: 云端最后一次观测到节点的时间（RFC3339）
                  type: string
                  format: date-time
                version:
                  description: edgecore 版本号
                  type: string
                  minLength: 1
                  pattern: "^[a-zA-Z0-9][a-zA-Z0-9._+-]*$"
                conditions:
                  description: 健康条件列表（如 Ready）
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        description: 条件类型，如 "Ready"
                        type: string
                        minLength: 1
                        pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
                      status:
                        description: 条件状态：True / False / Unknown
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        description: 机器可读原因（如 HeartbeatTimeout）
                        type: string
                        minLength: 1
                        pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
                      message:
                        description: 人类可读说明
                        type: string
                      lastTransitionTime:
                        description: 最近一次状态变化时间（RFC3339）
                        type: string
                        format: date-time
